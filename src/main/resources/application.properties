# StratOps 360 - Global Configuration
spring.application.name=stratops360
spring.profiles.active=dev
server.port=8080

# Spring Cache
spring.cache.type=simple
spring.cache.cache-names=scorecardSummary,kpiList

# Spring Boot Actuator (Safe Endpoints Only)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Server buffer and session settings
server.tomcat.resource.buffer-size=32768
server.servlet.session.tracking-modes=cookie

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expert System Threshold Configurations (Slide 9 Model)
stratops.expert.min-income=50000.0
stratops.expert.max-car-ratio=10.0
stratops.expert.max-mortgage-ratio=20.0
stratops.expert.min-tenure-years=4
stratops.expert.max-other-debt-ratio=5.0
stratops.expert.tier1-limit=10000.0
stratops.expert.tier2-limit=3000.0

# Simulation Model Baseline Assumptions (Slide 12)
stratops.simulation.base-operating-margin=15.4
stratops.simulation.base-net-profit=44.5
stratops.simulation.base-customer-retention=81.5
stratops.simulation.base-nps=68.0
stratops.simulation.base-cycle-time=6.8
stratops.simulation.base-defect-rate=1.3
stratops.simulation.base-employee-retention=92.8
