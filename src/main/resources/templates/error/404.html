<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('404 - Resource Not Found')}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div th:replace="~{fragments/layout :: overlay}"></div>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Not Found')}"></header>
        <div th:replace="~{fragments/layout :: toasts}"></div>

        <main class="content-container" style="max-width: 600px; text-align: center; margin-top: 40px;">
            <div class="card card-p32">
                <div class="status-indicator mb-3" style="justify-content: center;">
                    <span class="status-dot dot-amber"></span>
                    <span class="label-caption" style="text-transform: uppercase;">HTTP 404</span>
                </div>
                <h1 class="page-title mb-2">Resource Not Found</h1>
                <p class="label-muted mb-6" style="line-height: 1.6;"
                   th:text="${errorMessage != null ? errorMessage : 'The requested scorecard metric, decision initiative, or analytical page does not exist or has been archived.'}">
                    The requested resource could not be found.
                </p>
                <div class="flex justify-center gap-3">
                    <a th:href="@{/dashboard}" class="btn btn-primary">
                        Return to Dashboard →
                    </a>
                    <a th:href="@{/decision/pipeline}" class="btn btn-secondary">
                        Decisions Pipeline
                    </a>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
</body>
</html>
