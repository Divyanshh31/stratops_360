# Prod Profile - File-backed H2, Console Disabled, Caching Enabled
spring.datasource.url=jdbc:h2:file:./data/stratopsdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Web Console in Production
spring.h2.console.enabled=false

# Template Caching & HTTP Compression
spring.thymeleaf.cache=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

logging.level.com.stratops=INFO
